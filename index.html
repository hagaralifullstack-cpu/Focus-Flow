<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>مدرب التركيز اليومي</title>
        <style>
            :root{
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --primary: #38bdf8;
                --warning: #f59e0b;
                --danger: #f43f5e;
                --success: #10b981;
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 1rem;
            }

           .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
           }

           h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.6rem;
            color: var(--primary);
           }

           .suptitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
           }
           .timer {
            font-size: 3.5rem;
            font-weight: bold;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
           }

           .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
           }

           .btn {
            border: none;
            padding: 0.7rem 1.2rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: #0f172a;
           }

           .btn:active {
            transform: scale(0.96);
           }
            .btn:hover {
                opacity: 0.9;
            }

            .btn-start {
                background-color: var(--primary);
            }
            .btn-pause {
                background-color: var(--warning);
            }
            .btn-reset {
                background-color: #cbd5e1;
            }
            .btn-add {
                background-color: var(--success);
                color: white;
            } 

            .todo-section {
                border-top: 1px solid #334155;
                padding-top: 1.5rem;
                text-align: right;
            }

            .todo-section h3 {
                margin: 0 0 1rem 0;
                font-size: 1.1rem;
            }

            .input-group {
                display: flex;
                gap: 8px;
            }

            input{
                flex: 1;
                padding: 0.7rem;
                border-radius: 8px;
                border: 1px solid #475569;
                background: #0f172a;
                color: white;
                outline: none;
            }

            input:focus {
                border-color: var(--primary);
            }

            ul {
                padding: 0;
                margin-top: 1rem;
                list-style: none;
                max-height: 200px;
                overflow: auto;
            }

            li {
                background: #334155;
                padding: 0.7rem 1rem;
                margin-bottom: 0.6rem;
                border-radius: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: 0.2s;
            }

            .task-test {
                cursor: pointer;
                flex: 1;
            }

            .completed {
                text-decoration: line-through;
                color: #94a3b8;
            }

            .delete-btn {
                background: none;
                border: none;
                color: var(--primary);
                font-size: 1.1rem;
                cursor: pointer;
                padding: 0 5px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>مؤقت التركيز</h1>
            <p class="suptitle">حدد مهمتك وابدأ العمل لمدة 25 دقيقة</p>
            <div class="timer" id="timerDisplay">25:00</div>
            <div class="controls">
                <button class="btn btn-start" onclick="startTimer()">ابدأ</button>
                <button class="btn btn-pause" onclick="pauseTimer()">إيقاف مؤقت</button>
                <button class="btn btn-reset" onclick="resetTimer()">إعادة ضبط</button>
        </div>
        <div class="todo-section">
            <h3>مهام اليوم:</h3>
            <div class="input-group">
               <input type="text" id="taskInput" placeholder="اكتب مهمتك واضغط Enter..." onkeypress="handleEnter(event)">
                <button class="btn btn-add" onclick="addTask()">إضافة</button> 
            </div>
            <ul id="taskList"></ul>
        </div>
            </div>
        </div>

        <script>
        // --- أولاً: برمجة المؤقت ---
        let minutes = 25;
        let seconds = 0;
        let timerInterval = null;

        function updateDisplay() {
            const m = minutes < 10 ? "0" + minutes : minutes;
            const s = seconds < 10 ? "0" + seconds : seconds;
            document.getElementById("timerDisplay").innerText = `${m}:${s}`;
        }

        function startTimer() {
            if (timerInterval !== null) return; 

            timerInterval = setInterval(() => {
                if (seconds === 0) {
                    if (minutes === 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        alert("عاش! انتهى وقت التركيز، خذ استراحة 5 دقائق.");
                        resetTimer();
                        return;
                    }
                    minutes--;
                    seconds = 59;
                } else {
                    seconds--;
                }
                updateDisplay();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            minutes = 25;
            seconds = 0;
            updateDisplay();
        }

        // --- ثانياً: برمجة قائمة المهام والحفظ ---
        document.addEventListener("DOMContentLoaded", loadTasks);

        function handleEnter(event) {
            if (event.key === "Enter") {
                addTask();
            }
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();
            if (text === "") return;

            createTaskElement(text, false);
            saveTasks();
            input.value = "";
        }

        function createTaskElement(text, isCompleted) {
            const ul = document.getElementById("taskList");
            const li = document.createElement("li");

            const span = document.createElement("span");
            span.innerText = text;
            span.className = "task-text";
            if (isCompleted) span.classList.add("completed");

            span.onclick = function() {
                span.classList.toggle("completed");
                saveTasks();
            };

            const delBtn = document.createElement("button");
            delBtn.innerText = "✖";
            delBtn.className = "delete-btn";
            delBtn.onclick = function() {
                li.remove();
                saveTasks();
            };

            li.appendChild(span);
            li.appendChild(delBtn);
            ul.appendChild(li);
        }

        function saveTasks() {
            const tasks = [];
            document.querySelectorAll("#taskList li").forEach(li => {
                const span = li.querySelector(".task-text");
                tasks.push({
                    text: span.innerText,
                    completed: span.classList.contains("completed")
                });
            });
            localStorage.setItem("myFocusTasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            const saved = localStorage.getItem("myFocusTasks");
            if (!saved) return;
            
            const tasks = JSON.parse(saved);
            tasks.forEach(task => createTaskElement(task.text, task.completed));
        }
    </script>

</body>
</html>
